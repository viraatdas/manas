# Full end-to-end verification on every push: macOS build + unit suite,
# live backend contract (phone auth enabled, OTP, CRUD, RLS), live client
# integration through the real backend, and the iOS app + widget build.
# The anon key in SupabaseConfig.swift is publishable, so CI needs no secrets.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # macos-15 defaults to Xcode 16.4, whose SILGen crashes lowering the lazy
    # global initializer for UsageAnalytics.shared (a @MainActor @Observable
    # class). That crash — not a failing test — is what kept this workflow red
    # for 21 consecutive runs from 2026-07-29, while `swift build && swift
    # test` stayed green locally on Xcode 26. A CI that compiles a different
    # language version than the release does is not verifying the release.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pin the toolchain releases are actually built with
        # Loud on drift rather than silently green on the wrong compiler: if
        # the image moves off Swift 6.x, this stops the run instead of letting
        # the gap reopen unnoticed.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || true
          xcodebuild -version
          swift --version
          swift --version 2>&1 | grep -qE 'Apple Swift version 6\.' \
            || { echo "::error::CI toolchain drifted off Swift 6.x — releases are built with it"; exit 1; }
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run the full end-to-end suite
        run: scripts/e2e.sh
